name: Build and deploy JAR app to Azure Web App - metrosys

on:
  push:
    branches:
      - metro-be
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install
        working-directory: metro-system

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: metro-system/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: java-app  # ✅ Quan trọng

      - name: List downloaded files
        run: ls -al java-app  # ✅ Kiểm tra file thực sự tồn tại

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B8FB60AECF39492BBB7C92609F9DEA9F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2FDB359556434AE98D2F41F7A0D83CD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF1420152310455F9FD5A06DB560590E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'metrosys'
          slot-name: 'Production'
          package: java-app/*.jar
